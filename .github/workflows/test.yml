name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          [
          '2.5',
          '2.6',
          '2.7',
          '3.0',
          '3.1',
          '3.2',
          '3.3',
          '3.4',
          '4.0',
          'head',
          'jruby-10.1',
          'jruby-head'
          ]
        # Rake replaces RUBYOPT for the test subprocess; keep it in Bundler's context.
        ruby-opt: ["-rbundler/setup --enable-frozen-string-literal --debug-frozen-string-literal"]
        include:
          # Ruby 2.5 through 3.1 have no prebuilt binaries for Ubuntu 26.04.
          - ruby-version: '2.5'
            os: ubuntu-24.04
          - ruby-version: '2.6'
            os: ubuntu-24.04
          - ruby-version: '2.7'
            os: ubuntu-24.04
          - ruby-version: '3.0'
            os: ubuntu-24.04
          - ruby-version: '3.1'
            os: ubuntu-24.04
          - ruby-version: '3.2'
            os: ubuntu-latest
          - ruby-version: '3.3'
            os: ubuntu-latest
          - ruby-version: '3.4'
            os: ubuntu-latest
          - ruby-version: '4.0'
            os: ubuntu-latest
          - ruby-version: 'head'
            os: ubuntu-latest
          - ruby-version: 'jruby-10.1'
            os: ubuntu-latest
          - ruby-version: 'jruby-head'
            os: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Java
      if: startsWith(matrix.ruby-version, 'jruby-')
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
        cache-version: 2
    - name: Run tests
      run: bundle exec rake --trace RUBYOPT="${{ matrix.ruby-opt }}"
